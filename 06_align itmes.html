<!-- align item: this is just same is justtifacation(main axis) but as aligment of text for the cross .axis -->
<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex direction</title>
    <style>
        *{ padding:0;}
    .box
    {height:100px;
    width:100px;
    border: 3px solid black;
    margin:5px;}



    #container
    
       { height: 600px;
        width:600px;
        padding:10px;
        margin:10px;
        border:3px solid black;
        background-color: darkgrey;


        display:flex;
        justify-content:center;
         /* (this is for main axis)} */
        align-items: center;}
         /* (this is for cross axis alignment of the items. but not about the spacing with aligment that is taken care by align content.)}
         
          also this actually aligns the self of every element there is also call self align for each element and this applies that property on all over elements you are giving to*/
   

    


    
#box1 {background-color: aqua;}
#box2 {background-color: blueviolet;}
#box3 { background-color: yellow;}
#box4 {background-color: tomato;}


    </style>
 </head>
 <body>
    <h2 id  ="head">align items.</h2>
    <hr>
    <div id = "container">
        <div id ="box1" class ="box"> box1</div>
        <div id ="box2" class ="box"> box2</div>
        <div id ="box3" class ="box"> box3</div>
        <div id ="box4" class ="box"> box4</div>
    </div>

    
 </body>
 </html>
