<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative percentage sizing.</title>
    <style>
        #first
        {background-color:burlywood;
        font-size:25px;
        height:400px;
        width:400px;
        }

        #second
        {background-color:rgb(123, 47, 255);
        font-size:25px;
        height:50%;
        width:50%;
        
        }
    </style>
</head>
<body>
    <h2>this is relative sizing via percentage.
    </h2>
    <br>
    <hr>
    <br>
    <div id = "first">box1
    <div id = "second">box2</div>
    </div>
    <!-- To the relative sizing the div we want to do relative sizing must ine the outher div from which wewant to take refrence can say that other acts as child to the parent the child must be inside the parent one. -->
     

    <!-- but if you dont make the div inside the other the it will take reference of the whole document size and as per that it takes its size . -->

</body>
</html>
