<!-- ALIGN SELF -->

<!-- align self have much more priority as compared to the aligned items -->

<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex direction</title>
    <style>
        *{ padding:0;}
    .box
    {height:100px;
    width:100px;
    border: 3px solid black;
    margin:5px;}



    #container
    
       { height: 600px;
        width:600px;
        padding:10px;
        margin:10px;
        border:3px solid black;
        background-color: darkgrey;


        display:flex;
        flex-direction:row;
        flex-wrap:wrap;
        justify-content:center;
        align-items: center;}
        
   

    


    
#box1 {background-color: aqua;}
#box2 {background-color: blueviolet;}
#box3 { background-color: yellow; align-self:flex-end;}
/* this cross alignment is just the alignment of the prticular element ina certain position in the crosss axis only since the alignment in the main axis is just defined by the justify content. */
#box4 {background-color: tomato;}


    </style>
 </head>
 <body>
    <h2 id  ="head">The self align property for the box three.</h2>
    <hr>
    <div id = "container">
        <div id ="box1" class ="box"> box1</div>
        <div id ="box2" class ="box"> box2</div>
        <div id ="box3" class ="box"> box3</div>
        <div id ="box4" class ="box"> box4</div>
    </div>

    
 </body>
 </html>
