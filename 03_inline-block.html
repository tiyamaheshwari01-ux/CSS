<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cheaking on what display blaock element mean</title>
    <style>
        .box
        {background-color:blueviolet;
        height: 50px;
        width:50px;
        text-align:center;
        border-radius:10px ;
        border:5px solid black;
        margin:10px;
        display:inline-block;}
        /* PROBLEM-SOLVED HERE */

         /* giving the inline-block property the other properties assigned to the elemnt whill remain the same while the by default block elements will be made in as a inline  now. */
    </style> 
</head>
<body>
    <h1>this is block elements but inline using the inline-block.</h1>
    <hr>
    <div id="first" class = "box"> box1</div>
    <div id="second" class = "box"> box2</div>
    <div id="third" class = "box"> box3</div>
</body>
</html>
