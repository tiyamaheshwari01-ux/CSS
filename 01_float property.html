<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float Property</title>

<style>
.container {
    border: 2px solid black;
    padding: 10px;
    overflow: auto;
}

.zero {
    float: left;
    width: 100px;
    height: 100px;
    background-color: lightblue;
}

.one {
    float: left;
    width: 100px;
    height: 100px;
    background-color: lightblue;
}

.two {
    float: right;
    width: 100px;
    height: 100px;
    background-color: lightgreen;
}
</style>

</head>
<body>

<div class="container">
    <div class="zero">Box 0</div>
    <div class="one">Box 1</div>
    <div class="two">Box 2</div>
</div>

</body>
</html>
