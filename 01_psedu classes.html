<!-- THE PSECUDO CLASSES -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>psedoclases</title>
    <style>
        .btn
        { height: 50px;
          width: 100px;
          background-color: blue;
          color: white;
          border: solid 1px black;
          border-radius: 5px;
        }
        .btn:hover
        {
            height:100px;
            width: 150px;
            background-color: red;
        }
        /* here we can see tat hile hovering or making avtive or focus using any property of the pseudo class we can change the property of the element and make it more attractive and eye catching. also can change it at the timing hovering ,click , or focus anything. */
        .btn:active
        { border: solid 2px black;
          background-color: green;
        }
    </style>

</head>
<body>
    <h2>Making a botton hover,active,click</h2>
    <hr>
    <br>
    here ,is the button to try out how does the hover,active and focus function works on.<br>
    <button class="btn">Click me</button>
</body>
</html>
