  <!-- revising the what is padding??
 the padding is aroung the main content  -->


 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding property</title>
    <style>
        * {margin:0;padding:0;}
        #padded{ height: 50px; width: 50px ;
        /* here the width and the height defines actually the parameter of the main content central content */
         padding:5px 5px 5px 5px; 

        /* if we define a single value in the paddind the styling will consider that the value is the same for all four sides. */
    
         /* here we are padding all this clockwise direction 
         the amount of pixels assigned in padding is added in the total dimensions of the box model
         and this is considered to be the part of the content */ 


         background-color:blueviolet;}
    </style>
 </head>
 <body>
    <div id ="padded">the padding cheaker</div>
 </body>
 </html>
