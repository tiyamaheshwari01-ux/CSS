<!-- here we talk about vh and vw which is 
VH- view code height.
VW- view code width.
 this mean everything will be relative the to the vh and vw of the total view board. -->


 <!-- this is done relatively to the view borad which make everything conventional so it will change as per the the screen size change so this is more better for making a web so that there will be less disturbance on every single and different screen which will make better experience for the used and the easy for web deverloper. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>talking about vh and vw.</title>
    <style>
        #one
        {background-color:blue;
        height:50vh;
        width:50vd;
        font: size 50px;}
    </style>
</head>
<body>
    <h2>this is relative sizing via view code height and width.</h2>
    <hr>
    <div id ="one">box</div>
</body>
</html>
