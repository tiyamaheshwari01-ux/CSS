<!-- * **Usage:** Adds an image as a background to elements.
* **Syntax:** Defined using `background-image: url('path/to/image');`
* **Repetition:** Control image repetition using `background-repeat`.
* **Positioning:** Adjust image position using `background-position`.
* **Size Control:** Manipulate image size using `background-size`.
* **Background-Attachment:** Sets whether the background image scrolls with the element or remains fixed.
* **Shorthand:** Combine properties like color, image, repeat, attachment, and position in one declaration. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image in background</title>
    <style>
       #image { height:100px; width:100px;
        background-image:url(kriti.png);
        background-size:contain;
    background-repeat: no-repeat;}
    </style>
</head>
<body>
    <div id = "image"></div>
</body>
</html>
