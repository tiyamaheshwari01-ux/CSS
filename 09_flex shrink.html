<!-- flex shrink -->


<!-- the same was we made slignemt on one element specifically same way we can shrink only one selected element and then apply the shrink property to that you ca see in the given code -->

<!-- 
for example there are multiple images on you web so there will be diffferent screen for the smaller scren it can help us to make the unimporatant images smaller in size and then till the web look responsive -->
<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>specific shrink</title>
    <style>
        *{
    margin: 0;
    padding: 0;
}

.box{
    height: 200px;
    width: 200px;
    border: 3px solid black;
    margin: 5px;
}

#heading{
    text-align: center;
}

#container{
    height: 300px;
    width: 600px;
    padding: 10px;
    margin: 20px;
    border: 3px solid black;
    background-color: lavender;

    display: flex;
    justify-content: center;
}

#box1{background-color: aqua;}
#box2{background-color: blueviolet; flex-shrink:4;}
 /* here the no in the flex shrink represents that the how many time of the orginal box it will diminih */
#box3{background-color: yellow;}
#box4{ background-color: tomato;}


    </style>
 </head>
 <body>
    <h2 id  ="head">The shrink on a specific on element.</h2>
    <hr>
    <div id = "container">
        <div id ="box1" class ="box"> box1</div>
        <div id ="box2" class ="box"> box2</div>
        <div id ="box3" class ="box"> box3</div>
        <div id ="box4" class ="box"> box4</div>
    </div>

    
 </body>
 </html>
