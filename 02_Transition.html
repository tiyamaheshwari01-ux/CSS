<!-- THE TRANSITIONS -->

<!-- this helps in smooth css transition with different when we defines the intial and final state of the element and the duration of the transition. it is used to make the website more attractive and eye catching. it is also used to make the website more user friendly and interactive.

al the inbetween transition of the nimation required by css is set by the browser it self. we just need to set the initial and final state of the element and the duration of the transition. it is also used to make the website more user friendly and interactive. -->


<!-- 1. transition property.
2. transition-duration property.
3. transition-timing-function property.
4. transition-delay property. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Transitions</title>
    <style>
        .btn
        { height: 50px;
          width: 100px;
          background-color: blue;
          color: white;
          border: solid 1px black;
          border-radius: 5px;
          transition: all 0.5s ease-in-out;
          transition-timing-function: step(3);
          transition-delay: 1.0 sec;
        }
        .btn:hover
        {
            height:60x;
            width: 120px;
            background-color: red;
        }
    
        .btn:active
        { border: solid 2px black;
          background-color: green;
        }
    </style>

</head>
<body>
    <h2>how we did the smooth transition</h2>
    <hr>
    <br>
    here ,is the button to try out how does the hover,active and focus function works on.<br>
    <button class="btn">Click me</button>
</body>
</html>
