<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative percentage sizing.</title>
    <style>
        #first
        {background-color:burlywood;
        font-size:25px;
        height:400px;
        width:400px;
        }

        #second
        {background-color:rgb(123, 47, 255);
        font-size:2em;
/* 
        talking about the font size is is just 2 times is if div is inside din the  em can be defined relativly as to the first as seen for font size the text size will become 2 times for the first one since defined as 2 em. */

        /* CAN ALSO OBSERVE IN OUTPUT. */
        height:50%;
        width:50%;
        
        }
    </style>
</head>
<body>
    <h2>this is relative sizing via percentage.
    </h2>
    <br>
    <hr>
    <br>
    <div id = "first">box1
    <div id = "second">box2</div>
    </div>


</body>
</html>
