 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex direction</title>
    <style>
        *{ padding:0;}
    .box
    {height:100px;
    width:100px;

    border: 3px solid black;
    margin:5px;}
    #container
    {
        height: 350px;
        width:350px;
        padding:10px;
        margin:10px;
        border:3px solid black;
        background-color: darkgrey;


        display:flex;
        flex-wrap:wrap-reverse;}
         /* value to the flex-wrap is:
         1.nowrap
         2.wrap
         3.reverse-wrap */
        /* no wrap is the default value which evenr shrik to fint in the single row if rquired and adjust wrap here to archive it in actual size without adjustment. */
   


#box1 {background-color: aqua;}
#box2 {background-color: blueviolet;}
#box3 { background-color: yellow;}
#box4 {background-color: tomato;}


    </style>
 </head>
 <body>
    <h2 id  ="head">flex wrap</h2>
    <hr>
    <div id = "container">
        <div id ="box1" class ="box"> box1</div>
        <div id ="box2" class ="box"> box2</div>
        <div id ="box3" class ="box"> box3</div>
        <div id ="box4" class ="box"> box4</div>
    </div>

    
 </body>
 </html>
